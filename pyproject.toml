[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl400-spoter"
version = "1.0.0"
description = "Vietnamese Sign Language recognition (VSL400) with a 3-view SPOTER teacher and a front-view student"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "pyyaml>=6.0", "torch>=2.1"]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
extract = ["mediapipe>=0.10", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]
