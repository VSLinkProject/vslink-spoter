paths:
  keypoint_root: null
  index_csv: null
  labels_json: null
  output_dir: outputs

data:
  t_frames: 60
  num_keypoints: 75
  views: [front, left, right]
  cache_workers: 4
  split:
    seed: 42
    ratios: [6, 1, 4]
    expected:
      val_signers: [15, 26]
      test_signers: [1, 3, 4, 6, 9, 10, 20, 23, 24, 27]
      counts: {train: 11993, val: 3008, test: 9751}

model:
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.3
  num_classes: 400
  channels: 6

train:
  batch_size: 32
  weight_decay: 0.02
  label_smoothing: 0.15
  ema_decay: 0.999
  loader_workers: 2
  student_loader_workers: 4
  log_every: 10

teacher:
  epochs: 70
  lr: 3.0e-4
  warmup: 5
  mixup: 0.2
  seed: 1

student:
  epochs: 40
  lr: 1.0e-4
  warmup: 3
  seed: 42

augment:
  teacher:
    jitter_std: 0.02
    scale_range: [0.9, 1.1]
    rotate_deg: 10.0
    frame_drop_max: 4
    p_jitter: 0.5
    p_scale: 0.5
    p_rotate: 0.5
    p_frame_drop: 0.3
    p_view_dropout: 0.15
  student:
    prob: 0.5
    rotate_deg: 13.0
    perspective: [0.0, 0.1]
    squeeze: [0.0, 0.15]
    arm_joint_p: 0.3
    arm_joint_deg: 4.0
    noise_sigma: 0.001

export:
  opsets: [17, 14]
